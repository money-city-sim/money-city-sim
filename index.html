<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
</head>
<body data-mode="sim">
<title>Money City · Sim World</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bagel+Fat+One&family=Chakra+Petch:wght@400;500;600;700&display=swap">
<style>
/* Layout: a 3D low-poly dollhouse city fills the hero, in four districts (finance, news & politics, sports, construction); agents and citizens walk the roads; a side panel (stacked on phones) holds place details and agent chats. */
:root{
  --display:"Bagel Fat One","Arial Rounded MT Bold",system-ui,sans-serif;
  --body:"Chakra Petch",ui-sans-serif,system-ui,sans-serif;
  --bg:#e4ecef; --ink:#1b2830; --muted:#55666f; --line:#c3d2d7; --panel:#fafcfc; --panel2:#edf3f5;
  --sky:#bfe3ea; --accent:#d9603a; --good:#2f8a55; --warn:#b97c10; --bad:#c4432c; --teal:#2f7f90; --gold:#d9a22e;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0b141c; --ink:#e2ecef; --muted:#8fa3ac; --line:#24394a; --panel:#111f29; --panel2:#172a36;
  --sky:#0c1622; --accent:#ff8a5e; --good:#6cc48c; --warn:#e8b14c; --bad:#ff6a52; --teal:#5fc0d0; --gold:#f0bf4c; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#0b141c; --ink:#e2ecef; --muted:#8fa3ac; --line:#24394a; --panel:#111f29; --panel2:#172a36;
  --sky:#0c1622; --accent:#ff8a5e; --good:#6cc48c; --warn:#e8b14c; --bad:#ff6a52; --teal:#5fc0d0; --gold:#f0bf4c; color-scheme:dark }

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 32px}
.wrap{max-width:1360px;margin:0 auto;display:grid;gap:14px}
header{display:flex;flex-wrap:wrap;align-items:end;justify-content:space-between;gap:12px}
h1{font-family:var(--display);font-weight:400;font-size:clamp(28px,4.4vw,44px);line-height:1;margin:0;text-wrap:balance}
h1 small{display:block;font-family:var(--body);font-size:13px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.hud{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:6px 12px;display:flex;gap:8px;align-items:baseline;font-variant-numeric:tabular-nums}
.chip span{font-size:12px;color:var(--muted);letter-spacing:.04em;text-transform:uppercase}
.world{display:grid;grid-template-columns:minmax(0,1fr) 420px;gap:16px;align-items:start}
@media (max-width:980px){.world{grid-template-columns:minmax(0,1fr)}}
@media (max-width:560px){.hud{gap:5px}.chip{padding:3px 9px;gap:5px;font-size:13px}.chip span{font-size:10px;letter-spacing:.02em}h1{font-size:28px}}
.stage{position:relative;border-radius:22px;overflow:hidden;background:var(--sky);border:1px solid var(--line);height:clamp(400px,74vh,820px);min-width:0;touch-action:none}
.stage canvas{display:block;width:100%;height:100%;cursor:grab}
.stage canvas:active{cursor:grabbing}
.tags{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.tag{position:absolute;left:0;top:0;transform:translate(-50%,-100%);pointer-events:auto;cursor:pointer;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:3px 9px 4px;white-space:nowrap;text-align:center;box-shadow:0 2px 8px rgb(0 0 0 / .12);font:inherit;color:var(--ink)}
.tag b{display:block;font:400 13px var(--display);line-height:1.15}
.stage.compact .tag{padding:2px 7px}.stage.compact .tag span{display:none}.stage.compact .tag b{font-size:11px}
.stage.compact .tag.roomtag span,.tag.roomtag span{display:block}.tag.roomtag{padding:2px 8px}
.tag span{display:block;font-size:11px;font-weight:600;color:var(--muted);font-variant-numeric:tabular-nums}
.tag.sel{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tag.sel span{color:var(--bg);opacity:.8}
.tag:focus-visible,.atag:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.atag{position:absolute;left:0;top:0;transform:translate(-50%,-100%);pointer-events:auto;cursor:pointer;font:700 11px var(--body);color:#fff;border-radius:999px;padding:1px 8px;white-space:nowrap;border:0}
.atag i{font-style:normal;display:inline-block;margin-left:4px;background:#fff;color:#000;border-radius:999px;padding:0 5px}
.hint{position:absolute;left:12px;bottom:12px;font-size:12px;font-weight:600;color:var(--muted);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:4px 9px;pointer-events:none}
.fallback{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:24px;color:var(--muted)}
.toast{position:absolute;right:12px;bottom:12px;display:grid;gap:6px;justify-items:end;max-width:calc(100% - 24px)}
.toast div{background:var(--ink);color:var(--bg);border-radius:10px;padding:7px 10px;font-size:13px;display:flex;gap:10px;align-items:center}
.toast button{all:unset;cursor:pointer;font-weight:700;text-decoration:underline}

/* panel */
.panel{background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:18px;display:grid;gap:16px;min-width:0}
@media (min-width:981px){.panel{position:sticky;top:max(16px,env(safe-area-inset-top,0px));max-height:calc(100vh - 32px);overflow:auto}}
.tabs{display:flex;gap:6px;background:var(--panel2);border-radius:12px;padding:4px}
.tabs button{flex:1;font:700 14px var(--body);color:var(--muted);background:transparent;border:0;border-radius:9px;padding:8px;cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--panel);color:var(--ink);box-shadow:0 1px 3px rgb(0 0 0 / .12)}
.tabs button:focus-visible,.btn:focus-visible,.places button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.places{display:flex;flex-wrap:wrap;gap:6px}
.places button{font:600 12px var(--body);color:var(--ink);background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:4px 9px;cursor:pointer}
.places button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.kicker{font-size:12px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}
.panel h2{font-family:var(--display);font-weight:400;font-size:30px;line-height:1.05;margin:2px 0 0;text-wrap:balance}
.facts{margin:0;padding:0;list-style:none;display:grid;gap:6px}
.facts li{display:flex;gap:10px;align-items:baseline}
.facts li::before{content:"";flex:none;width:7px;height:7px;border-radius:2px;background:var(--teal);transform:translateY(-1px)}
.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.field{display:grid;gap:4px;min-width:0}
.field.wide{grid-column:1/-1}
.field>span{font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.04em}
.inp{display:flex;align-items:center;min-width:0;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:0 10px}
.inp:focus-within{border-color:var(--ink)}
.inp i{font-style:normal;color:var(--muted);font-weight:600}
.inp input{all:unset;flex:1;min-width:0;padding:8px 6px;font:600 15px var(--body);color:var(--ink);font-variant-numeric:tabular-nums}
.inp input::placeholder{color:var(--muted);opacity:.7;font-weight:400}
.range{display:grid;gap:4px}
.range .top{display:flex;justify-content:space-between;font-size:12px;font-weight:600;color:var(--muted)}
.range .top b{color:var(--ink);font-variant-numeric:tabular-nums}
input[type=range]{width:100%;accent-color:var(--accent)}
.out{display:grid;gap:12px;border-top:1px dashed var(--line);padding-top:14px}
.big{font-family:var(--display);font-size:34px;line-height:1;font-variant-numeric:tabular-nums}
.stat{display:grid;gap:2px}
.stat span{font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.04em;text-transform:uppercase}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.stats b{font-size:19px;font-variant-numeric:tabular-nums}
.bar{display:flex;height:16px;border-radius:6px;overflow:hidden;background:var(--panel2);border:1px solid var(--line)}
.bar>div{height:100%}
.legend{display:grid;gap:4px;font-size:13px}
.legend div{display:flex;align-items:center;gap:8px;font-variant-numeric:tabular-nums}
.legend i{width:10px;height:10px;border-radius:3px;flex:none}
.legend em{font-style:normal;margin-left:auto;font-weight:600}
.pill{display:inline-block;font-size:12px;font-weight:700;padding:2px 9px;border-radius:999px;letter-spacing:.03em}
.pill.good{background:color-mix(in srgb,var(--good) 18%,transparent);color:var(--good)}
.pill.warn{background:color-mix(in srgb,var(--warn) 20%,transparent);color:var(--warn)}
.pill.bad{background:color-mix(in srgb,var(--bad) 18%,transparent);color:var(--bad)}
.note{font-size:13px;color:var(--muted);margin:0}
.card{border:1px solid var(--line);border-radius:14px;padding:12px;display:grid;gap:10px;background:var(--panel2)}
.card h3{margin:0;font-size:16px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.subrow{display:grid;grid-template-columns:minmax(0,1fr) 110px auto;gap:8px;align-items:center}
.subrow label.chk{display:flex;gap:4px;align-items:center;font-size:12px;color:var(--muted);cursor:pointer}
.subrow .inp input{padding:6px 4px}
.chart{width:100%;height:auto;display:block}
.axis{font:500 11px var(--body);fill:var(--muted);font-variant-numeric:tabular-nums}
.gridl{stroke:var(--line);stroke-width:1}
.area{fill:var(--good);opacity:.22}
.line{fill:none;stroke:var(--good);stroke-width:2.5}
.cline{fill:none;stroke:var(--muted);stroke-width:1.5;stroke-dasharray:4 4}
.dot{fill:var(--good)}

/* agents */
.agents{display:grid;gap:8px}
.agent{all:unset;box-sizing:border-box;cursor:pointer;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:14px;background:var(--panel2)}
.agent:hover{border-color:var(--ink)}
.agent:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.av{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;color:#fff;font:400 18px var(--display)}
.agent b{display:block}
.agent span{font-size:13px;color:var(--muted)}
.status{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.status.busy{color:var(--accent)}
.ahead{display:flex;align-items:center;gap:12px}
.ahead .back{all:unset;cursor:pointer;font-weight:700;color:var(--muted);font-size:13px}
.quick{display:flex;flex-wrap:wrap;gap:6px}
.btn{font:600 13px var(--body);color:var(--ink);background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:6px 12px;cursor:pointer}
.btn:hover{border-color:var(--ink)}
.btn.primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn:disabled{opacity:.5;cursor:default}
.log{display:grid;gap:8px;max-height:360px;overflow:auto;padding-right:2px}
.msg{padding:9px 12px;border-radius:14px;white-space:pre-wrap;font-size:14px;max-width:92%;overflow-wrap:anywhere}
.msg.me{justify-self:end;background:var(--ink);color:var(--bg);border-bottom-right-radius:4px}
.msg.ag{justify-self:start;background:var(--panel2);border:1px solid var(--line);border-bottom-left-radius:4px}
.msg.sys{justify-self:center;font-size:12px;color:var(--muted);padding:2px}
.compose{display:flex;gap:8px}
.compose .inp{flex:1}
.alerts{display:grid;gap:6px;margin:0;padding:0;list-style:none}
.alerts li{display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px;align-items:start;font-size:14px}
.alerts li i{width:8px;height:8px;border-radius:50%;margin-top:7px}
.foot{font-size:12px;color:var(--muted);text-align:center}

.districts{display:flex;flex-wrap:wrap;gap:6px}
.districts button{font:700 12px var(--body);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);background:transparent;border:1px solid var(--line);border-radius:999px;padding:5px 11px;cursor:pointer}
.districts button[aria-pressed="true"]{color:var(--bg);background:var(--accent);border-color:var(--accent)}
.districts button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.stagebar{position:absolute;right:12px;top:12px;display:flex;gap:6px;flex-wrap:wrap;justify-content:end;max-width:min(640px,calc(100% - 24px))}
.stagebar button{font:700 12px var(--body);color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:5px 11px;cursor:pointer}
.stagebar button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.stagebar button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.news{display:grid;gap:12px;margin:0;padding:0;list-style:none}
.news li{display:grid;gap:3px;padding-bottom:12px;border-bottom:1px solid var(--line)}
.news li:last-child{border-bottom:0;padding-bottom:0}
.news b{font-size:15px;line-height:1.3}
.news p{margin:0;font-size:13px;color:var(--muted)}
.news small{font-size:12px;color:var(--muted);font-weight:600}
.news a{color:var(--teal);font-weight:700;text-decoration:none}
.news a:hover{text-decoration:underline}
.cat{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase}
.mkt{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:14px}
.mkt td{padding:6px 0;border-bottom:1px solid var(--line)}
.mkt td:nth-child(2),.mkt td:nth-child(3){text-align:right}
.mkt td+td{padding-left:12px}
.up{color:var(--good);font-weight:700}.dn{color:var(--bad);font-weight:700}
.games{display:grid;gap:6px}
.game{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:7px 10px;font-variant-numeric:tabular-nums}
.game .t{display:grid;gap:1px;font-size:14px}
.game .t span{display:flex;justify-content:space-between;gap:12px}
.game .t .w{font-weight:700}
.game em{font-style:normal;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);text-align:right;min-width:72px}
.game em.live{color:var(--bad)}
.stamp{font-size:12px;color:var(--muted);font-weight:600}
.prog{height:10px;border-radius:6px;background:var(--panel2);border:1px solid var(--line);overflow:hidden}
.prog div{height:100%;background:var(--warn)}
.buildlist{display:grid;gap:6px}
.buildlist button{all:unset;cursor:pointer;display:flex;justify-content:space-between;gap:10px;font-size:14px;padding:6px 10px;border-radius:10px;background:var(--panel2);border:1px solid var(--line)}
.buildlist button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.tag.small b{font-size:11px}
.lnk{background:none;border:0;padding:0;cursor:pointer;font:inherit;text-align:left}

.modes{display:flex;background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:3px;gap:2px}
.modes button{font:700 13px var(--body);border:0;border-radius:999px;padding:7px 14px;cursor:pointer;background:transparent;color:var(--muted)}
.modes button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.modes button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
body[data-mode="sim"] #tags,body[data-mode="sim"] #views,body[data-mode="sim"] .tabs{display:none}
body:not([data-mode="sim"]) #wtags,body:not([data-mode="sim"]) .simbar{display:none}
body[data-inside="1"] #wtags .tag:not(.roomtag),body[data-inside="1"] .simbar{display:none}
.lowerthird{position:absolute;left:16px;bottom:64px;z-index:6;background:rgba(10,16,24,.82);color:#fff;border-left:4px solid #e0703f;padding:8px 14px;border-radius:4px;display:grid;gap:2px;max-width:min(520px,calc(100% - 32px));opacity:0;transform:translateX(-12px);transition:opacity .5s,transform .5s;pointer-events:none}
.lowerthird.in{opacity:1;transform:none}.lowerthird b{font-size:16px}.lowerthird span{font-size:12px;color:#c9d6dd}
body[data-photo="1"] #wtags,body[data-photo="1"] .simbar,body[data-photo="1"] .lowerthird,body[data-photo="1"] #hotelBar{display:none}
.photoov{position:absolute;inset:0;z-index:7;pointer-events:none}.photoov .photobar{position:absolute;right:12px;bottom:12px;display:flex;gap:6px;pointer-events:auto}
.photoov .tsTop,.photoov .tsBot{position:absolute;left:0;right:0;height:30%;display:none;backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}.photoov .tsTop{top:0;-webkit-mask:linear-gradient(#000,transparent);mask:linear-gradient(#000,transparent)}.photoov .tsBot{bottom:0;-webkit-mask:linear-gradient(transparent,#000);mask:linear-gradient(transparent,#000)}
.photoov.ts .tsTop,.photoov.ts .tsBot{display:block}.photoov.ts{filter:saturate(1.25)}
.ivlog{display:grid;gap:4px;max-height:220px;overflow:auto}.ivlog p{margin:0;font-size:13px}.ivlog p.q{color:var(--muted)}
.mktcrash{border-color:#c4302b;background:#fff4f2}
.wikipage h2{margin:0 0 6px}.wikipage p{margin:.3em 0}
.frontpage{background:#fbf8f1;border-color:#d9cfb8;font-family:Georgia,serif;color:#1d2329}.frontpage :is(h1,h2,h3,h4,h5,p,li,em,span,b,strong,div,small,a,button,i,td,th){color:inherit}.frontpage .note,.frontpage small,.frontpage em{color:#5a5f66}.frontpage a,.frontpage .lnk{color:#2a5d9f}.frontpage .fpmast{display:flex;align-items:baseline;gap:10px;border-bottom:3px double #2b3338;padding-bottom:6px}.frontpage .fpmast span{font-weight:800;letter-spacing:.12em;font-size:18px}.frontpage .fpmast em{color:#6b7378;font-size:12px;flex:1}
.frontpage .fplead{font-size:22px;margin:4px 0 0;line-height:1.2}.frontpage .fpcols{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;border-top:1px solid #d9cfb8;padding-top:8px}.frontpage .fpcols p{margin:2px 0 0;font-size:13px}

body[data-mode="sim"] .hint{display:none}
body[data-mode="sim"] .stage{box-shadow:0 0 0 3px color-mix(in srgb,var(--warn) 55%,transparent)}
</style>

<div class="wrap">
  <header>
    <h1><small>A simulated world you can watch</small>Money City</h1>
    <div class="hud" id="hud"></div>
    <div class="modes" role="group" aria-label="World" style="display:none"><button type="button" id="modeReal" hidden>Real</button><button type="button" id="modeSim" aria-pressed="true">Sim world</button></div>
  </header>
  <div class="world">
    <div class="stage" id="stage">
      <div class="tags" id="tags"></div><div class="tags" id="wtags"></div>
      <div class="stagebar simbar"><button type="button" data-simgo="world">Whole world</button><button type="button" data-simgo="jam">Jamesland</button><button type="button" data-simgo="nor">Norland</button><button type="button" data-simgo="sol">Solara</button><button type="button" data-simgo="kai">Kaigan</button><button type="button" data-simgo="ver">Verdana</button><button type="button" data-simgo="tal">Talora</button><button type="button" data-simgo="val">Valdria</button><button type="button" data-simgo="amr">Amaru</button></div>
      <div class="stagebar" id="views">
        <button type="button" data-go="0,0">Finance</button>
        <button type="button" data-go="30,0">News</button>
        <button type="button" data-go="-40,0">Sports</button>
        <button type="button" data-go="0,-24">Construction</button>
        <button type="button" id="dh" aria-pressed="true">Dollhouse on</button>
        <button type="button" id="updateNow" title="Fetch the latest scores, news, weather and markets now">⟳ Update now</button>
        <button type="button" id="reloadCity" title="Reload the city to get the latest version">↻ Reload</button>
      </div>
      <div class="hint">Drag to orbit · pinch or scroll to zoom · tap a building or agent</div>
      <div class="toast" id="toast"></div>
    </div>
    <aside class="panel" id="panel">
      <div class="tabs" role="tablist">
        <button role="tab" id="tab-place" aria-selected="true">Places</button>
        <button role="tab" id="tab-agents" aria-selected="false">Agents</button>
      </div>
      <div id="pane"></div>
    </aside>
  </div>
  <p class="foot">Money City is a fictional, self-running world: every country, person, company and headline in it is simulated.</p>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
/* ================= finance state ================= */
const LS='money-city-sim-v1';
const DEF={
  takeHome:2054.11, gross:null,
  invest:{start:null,monthly:null,shares:null,navAt:null}, retire2:{start:null}, years:25, ret:7,
  savings:{bal:null,goal:null,monthly:null,rate:null},
  carda:{bal:null,apr:null,pay:null},
  cardb:{bal:null,apr:null,pay:null},

let ctl=null;
async function ask(aid,text){
  const a=AG[aid];text=text.trim();if(!text||busy[aid])return;
  if(!sampleFn){chats[aid].push({role:'sys',content:sampleState==='none'?'Agents need Claude access, which works when this page is open in Claude.':'Still connecting to Claude. Try again in a moment.'});renderPane();return}
  chats[aid].push({role:'user',content:text});const reply={role:'assistant',content:'Thinking…',pending:true};chats[aid].push(reply);
  busy[aid]=true;agentsGo();renderPane();ctl=new AbortController();
  try{
    if(a.crew){await mackAsk(a,text,reply)}
    else{const hist=chats[aid].filter(m=>(m.role==='user'||m.role==='assistant')&&!m.pending).slice(-8);
      const turns=hist.map((m,i)=>({role:m.role,content:i===hist.length-1?`${contextFor(a)}${m.content}`:m.content}));
      const opts={signal:ctl.signal,onText:({text})=>{reply.content=text;paintReply(aid)}};const t=financeTools(a);if(t)opts.tools=t;else opts.cache=false;
      const r=await sampleFn([{role:'user',content:rules(a)},...turns],opts);reply.content=r.text+(r.truncated?'\n\n(Cut short. Ask for less at a time.)':'')}}
  catch(e){const c=e&&e.code;reply.content=(e&&e.text)||'';
    const msg={cancelled:'Stopped.',not_granted:'Claude access was declined for this page, so agents are off for now.',rate_limited:'Too many requests. Try again in a bit.',sampling_disabled:'Claude isn\'t available for this account.',refused:'That request was declined. Try asking it differently.',invalid_json:'Mack scribbled something unreadable. Ask again.'}[c]||'Something went wrong reaching Claude. Try again.';
    if(c==='not_granted'||c==='sampling_disabled'){sampleFn=null;sampleState='none'}
    if(!reply.content)chats[aid].splice(chats[aid].indexOf(reply),1);chats[aid].push({role:'sys',content:msg})}
  delete reply.pending;busy[aid]=false;agentsGo();renderPane();
}
async function mackAsk(a,text,reply){
  const wantsStatus=/working on|status|what are you|progress/i.test(text)&&!/build|make|construct|surprise/i.test(text);
  if(wantsStatus){const act=Object.values(BUILDS).filter(b=>rawProg(b)<1);
    reply.content=act.length?act.map(b=>`${b.name} (${PL[b.plot]?.name}): ${phase(b)}.`).join('\n'):'Crew\'s on break. Give us a job, or we\'ll pick one ourselves soon.';return}

const NAT_IDS=Object.keys(NATIONS);
function landK(n,a){return 1+.11*Math.sin(3*a+n.ph[0])+.07*Math.sin(5*a+n.ph[1])+.04*Math.sin(9*a+n.ph[2])}
function depth1(n,x,z){const u=(x-n.cx)/n.rx,v=(z-n.cz)/n.rz;return Math.hypot(u,v)/landK(n,Math.atan2(v,u))}
function depth(n,x,z){let d=depth1(n,x,z);if(n.lobes)for(const L of n.lobes){const e=depth1(L,x,z);if(e<d)d=e}return d}
/** Which nation owns this point (null = sea). Neighbouring nations on one continent share land borders: a point belongs to the one it's deepest inside. */
function natBox(n,k=1.25){let x0=1e9,x1=-1e9,z0=1e9,z1=-1e9;for(const L of [n,...(n.lobes||[])]){x0=Math.min(x0,L.cx-L.rx*k);x1=Math.max(x1,L.cx+L.rx*k);z0=Math.min(z0,L.cz-L.rz*k);z1=Math.max(z1,L.cz+L.rz*k)}return{x0,x1,z0,z1,cx:(x0+x1)/2,cz:(z0+z1)/2,w:x1-x0,h:z1-z0}}
function ownerAt(x,z){let best=null,bd=1;for(const id of NAT_IDS){const d=depth(NATIONS[id],x,z);if(d<bd){bd=d;best=id}}return best}
function inLand(nid,x,z,m=.93){return depth(NATIONS[nid],x,z)<m&&ownerAt(x,z)===nid}
function landPt(nid,ang,r){const n=NATIONS[nid];const k=landK(n,ang);return[n.cx+Math.cos(ang)*n.rx*k*r,n.cz+Math.sin(ang)*n.rz*k*r]}
function coastPt(nid,ang){return landPt(nid,ang,.99)}

const TRENDS=['oversized blazers','bucket hats','retro sneakers','linen everything','neon windbreakers','vintage football shirts','wide-leg trousers','silver jewelry','embroidered jackets','tiny sunglasses'];
function trendOf(k,d){const season=Math.floor(d/24);const origin=NAT_ORDER[Math.floor(LH('trend',season)*NAT_ORDER.length)];const t=TRENDS[Math.floor(LH('tr',season)*TRENDS.length)];
  // a trend starts in one nation and reaches its trading partners a few days later
  const S=SIMSTATE&&SIMSTATE.S;const tr=S&&S.trade?(S.trade[[k,origin].sort().join('-')]||0):0;const lag=k===origin?0:Math.max(2,12-tr/2);return d-season*24>=lag?{t,from:origin}:{t:TRENDS[Math.floor(LH('tr',season-1)*TRENDS.length)],from:NAT_ORDER[Math.floor(LH('trend',season-1)*NAT_ORDER.length)]}}

/* ---------- turning points: moments in the remembered history that define an era ---------- */
function turningPoints(nid){const H=(SIMSTATE&&SIMSTATE.hist)||[];const out=[];let state={};const push=(day,k,t)=>{out.push({day,k,t})};
  for(let i=0;i<H.length;i++){const h=H[i],x=h.n[nid];if(!x||h.day==null)continue;const u=x.u!=null?x.u:1-x.emp;
    const run=(test,len)=>{let c=0;for(let j=i;j>=0&&c<len;j--){const y=H[j].n[nid];if(!y||!test(y,H[j]))return false;c++}return c>=len};
    if(!state.slump&&run(y=>(y.u!=null?y.u:1-y.emp)>.09,8)){state.slump=1;push(h.day,'slump','The Great Slump begins: unemployment above 9% for over a week')}
    if(state.slump&&u<.07){state.slump=0;push(h.day,'recovery','The recovery: jobs come back')}
    if(!state.boom&&i>=20){const g0=H[i-20].n[nid];if(g0&&x.gdp/g0.gdp>1.05){state.boom=1;push(h.day,'boom','The Boom Years: the economy grows 5% in 20 days')}}
    if(state.boom&&i>=20){const g0=H[i-20].n[nid];if(g0&&x.gdp/g0.gdp<1.01)state.boom=0}
    if(!state.unrest&&(x.un||0)>.5){state.unrest=1;push(h.day,'unrest','The Age of Unrest: mass protests in the streets')}if(state.unrest&&(x.un||0)<.2)state.unrest=0;
    if(!state.gold&&x.ap>63&&u<.05){state.gold=1;push(h.day,'gold','A Golden Age: high approval and near-full employment')}if(state.gold&&(x.ap<55||u>.07))state.gold=0;
    if(!state.infl&&i>=10){const c0=H[i-10].n[nid];if(c0&&x.cpi/c0.cpi>1.04){state.infl=1;push(h.day,'inflation','The Price Shock: prices jump 4% in ten days')}}if(state.infl&&i>=10){const c0=H[i-10].n[nid];if(c0&&x.cpi/c0.cpi<1.01)state.infl=0}}
  const S=SIMSTATE&&SIMSTATE.S;if(S){const N=S.nations[nid];if((N.sanctions||[]).length)push(simDay(),'sanction','Under sanctions: '+N.sanctions.map(x=>NATIONS[x].name).join(', '));if(N.spread>0)push(simDay(),'debt','The Debt Crisis');}
  if(WORLD&&WORLD.futureTowns)for(const ft of WORLD.futureTowns().filter(x=>x.nid===nid&&x.founded))out.push({day:ft.day,k:'build',t:`${ft.name} is founded`});
  for(const p of (S&&S.projects||[]).filter(p=>p.nation===nid&&p.done&&(p.kind==='metro'||p.kind==='stadium')))out.push({day:simDayOfMs(p.doneStep*SIM_STEP),k:'build',t:`${p.name} opens in ${p.city}`});
  return out.sort((a,b)=>a.day-b.day)}
const ERA_NAME={slump:'The Great Slump',recovery:'The Recovery',boom:'The Boom Years',unrest:'The Age of Unrest',gold:'The Golden Age',inflation:'The Price Shock',sanction:'The Sanctions Years',debt:'The Debt Crisis'};
function eraFor(nid,fallback){const tp=turningPoints(nid).filter(x=>ERA_NAME[x.k]);const last=tp.at(-1);return last&&simDay()-last.day<SIM_YEAR*2?ERA_NAME[last.k]:fallback}

/* ---------- ambient sound, synthesized live: city hum, surf, wind, rain, birds, distant horns ---------- */
const SIMSOUND=(()=>{let ctx=null,on=false,nodes=null;
  function noise(){const b=ctx.createBuffer(1,ctx.sampleRate*2,ctx.sampleRate),d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;const s=ctx.createBufferSource();s.buffer=b;s.loop=true;return s}
  function chan(freq,q,type){const n=noise(),f=ctx.createBiquadFilter();f.type=type||'lowpass';f.frequency.value=freq;f.Q.value=q||.7;const g=ctx.createGain();g.gain.value=0;n.connect(f).connect(g).connect(ctx.destination);n.start();return g}
  function start(){ctx=ctx||new(window.AudioContext||window.webkitAudioContext)();ctx.resume();if(!nodes)nodes={city:chan(380,.5),surf:chan(700,.4),wind:chan(1200,.3,'bandpass'),rain:chan(4200,.3,'highpass')};on=true}
  function chirp(){if(!ctx||!on)return;const o=ctx.createOscillator(),g=ctx.createGain();o.type='sine';const f0=2200+Math.random()*1800;o.frequency.setValueAtTime(f0,ctx.currentTime);o.frequency.exponentialRampToValueAtTime(f0*1.4,ctx.currentTime+.09);g.gain.setValueAtTime(.0001,ctx.currentTime);g.gain.exponentialRampToValueAtTime(.025,ctx.currentTime+.02);g.gain.exponentialRampToValueAtTime(.0001,ctx.currentTime+.12);o.connect(g).connect(ctx.destination);o.start();o.stop(ctx.currentTime+.15)}
  function horn(){if(!ctx||!on)return;const o=ctx.createOscillator(),g=ctx.createGain();o.type='sawtooth';o.frequency.value=98;const f=ctx.createBiquadFilter();f.frequency.value=400;g.gain.setValueAtTime(.0001,ctx.currentTime);g.gain.exponentialRampToValueAtTime(.05,ctx.currentTime+.3);g.gain.exponentialRampToValueAtTime(.0001,ctx.currentTime+2.4);o.connect(f).connect(g).connect(ctx.destination);o.start();o.stop(ctx.currentTime+2.5)}
  setInterval(()=>{if(!on||!nodes||MODE!=='sim'||!window.__C||!WORLD){if(nodes)Object.values(nodes).forEach(g=>g.gain.value=0);return}const C=window.__C;const d=C.camera.position.distanceTo(C.controls.target);const near=Math.max(0,1-d/600);
    const w=(typeof simWeather==='function')?(()=>{const t=C.controls.target;for(const [k,n0] of Object.entries(NATIONS))if(Math.hypot((t.x-n0.cx)/n0.rx,(t.z-n0.cz)/n0.rz)<1.2)return simWeather(k,simDay(),SIMCLOCK.parts().h);return null})():null;const h=SIMCLOCK.parts().h;const day=h>6&&h<21;
    const set=(g,v)=>g.gain.setTargetAtTime(v,ctx.currentTime,.4);set(nodes.city,near*(day?.12:.06));set(nodes.surf,.05+(1-near)*.05);set(nodes.wind,w?w.wind*.05:.02);set(nodes.rain,w&&w.precip?.07:0);
    if(day&&near>.3&&Math.random()<.35)chirp();if(Math.random()<.02)horn()},700);
  return{toggle(){if(on){on=false;if(nodes)Object.values(nodes).forEach(g=>g.gain.value=0)}else start()},get on(){return on}}})();

(async()=>{try{const s=window.claude&&await window.claude.use('sample');if(s){sampleFn=s;sampleState='ready';try{const l=await s.limits();canTools=!!l.tools}catch(e){}}else sampleState='none'}catch(e){sampleState='none'}
  if(view.tab==='agents')renderPane()})();
(async()=>{let d=null;try{d=window.claude&&await window.claude.use('db')}catch(e){}
  if(!d){dbState='none';paintOut();return}db=d;
  const slow=setTimeout(()=>{if(dbState==='loading'){dbState='slow';paintOut()}},10000);
  const onFeed=k=>s=>{FEED[k]=s.exists?s.data():null;if(!s.metadata.fromCache){dbState='ready';clearTimeout(slow)}if(k==='markets')rothReval();if(k==='weather')skyUpdate();feedsToScreens();hud();
    if(view.tab==='place')paintOut();else if(view.agent==='sterling'&&!busy.sterling)renderPane()};
  const onErr=()=>{dbState='slow';paintOut()};
  ['news','markets','sports','weather'].forEach(k=>db.doc('feeds/'+k).onSnapshot(onFeed(k),onErr));
  const onSim=k=>s=>{const d=s.exists?s.data():null;if(k==='world')SIMW=d;else if(k==='mayor')SIMMAYOR=d;else SIMSNAP=d;if(k!=='snapshot'){simLoaded=true;simRecompute()}};
  ['world','mayor','snapshot'].forEach(k=>db.doc('sim/'+k).onSnapshot(onSim(k),()=>{}));
  db.collection('builds').onSnapshot(q=>{const m={};q.docs.forEach(d=>{m[d.id]=d.data()});BUILDS=m;buildsLoaded=!q.metadata.fromCache||buildsLoaded;syncBuilds();
    if(view.tab==='place'&&PL[view.place].d==='build')renderPane();else if(view.tab==='agents'&&(!view.agent||view.agent==='mack')&&!busy.mack)renderPane()},onErr);
  setInterval(crewTick,20000);setTimeout(crewTick,4000)})();
setInterval(()=>{if(!document.hidden&&view.tab==='place'&&PL[view.place].d==='build'){const o=document.getElementById('out');if(o&&!o.contains(document.activeElement))paintOut()}},5000);




</script>
